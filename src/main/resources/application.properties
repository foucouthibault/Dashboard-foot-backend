spring.application.name=Dashboard-foot

# Football Data API Configuration
football-data.api.base-url=https://api.football-data.org/v4
football-data.api.token=${FOOTBALL_DATA_API_TOKEN:}

# Server port
server.port=8080

# Origines autorisées à appeler /api/** en GET depuis un navigateur (CORS), séparées par des
# virgules, ex. https://dashboard-foot.example. Vide : aucune origine externe autorisée.
# Surchargeable par la variable d'environnement APP_CORS_ALLOWED_ORIGINS.
app.cors.allowed-origins=

# Limite de débit interne sur les appels sortants vers football-data.org (fenêtre glissante d'1 minute)
football-data.api.rate-limit-per-minute=10

# Cache (Caffeine) : voir CacheConfig. TTL différencié pour éviter de retaper l'API
# pour rien : les ressources sans saison et la saison en cours évoluent, une saison
# terminée ne change plus jamais.
football-data.cache.static-ttl-seconds=60
football-data.cache.current-season-ttl-seconds=300
football-data.cache.historical-season-ttl-hours=24

# Documentation OpenAPI (springdoc) : spécification sur /v3/api-docs, Swagger UI sur /swagger-ui.html.
# OpenAPI 3.0 plutôt que 3.1 : "nullable: true" y est lu sans ambiguïté par les générateurs de types.
springdoc.api-docs.version=openapi_3_0
# Sortie stable (clés triées, indentée) : elle est comparée à openapi.json par OpenApiContractTest.
springdoc.writer-with-order-by-keys=true
springdoc.writer-with-default-pretty-printer=true
# Les réponses d'erreur sont décrites sur le contrôleur, pas déduites de ApiExceptionHandler.
springdoc.override-with-generic-response=false
# Type des réponses réussies dans la spécification (le contrôleur ne restreint pas Accept).
springdoc.default-produces-media-type=application/json
springdoc.swagger-ui.enabled=true

# Actuator : seul /actuator/health est exposé, sans détails ({"status":"UP"}). Il ne vérifie que
# l'application elle-même, jamais football-data.org : le contrôle de l'hébergeur ne consomme pas de quota.
management.endpoints.web.exposure.include=health
management.endpoints.jmx.exposure.exclude=*
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
# Pas de groupes liveness/readiness (sondes Kubernetes) : Render et Fly.io n'interrogent qu'une URL.
management.endpoint.health.probes.enabled=false
