spring.application.name=Dashboard-foot

# Football Data API Configuration
football-data.api.base-url=https://api.football-data.org/v4
football-data.api.token=${FOOTBALL_DATA_API_TOKEN}

# Server port
server.port=8080

# Limite de débit interne sur les appels sortants vers football-data.org (fenêtre glissante d'1 minute)
football-data.api.rate-limit-per-minute=10

# Cache (Caffeine) : voir CacheConfig. TTL différencié pour éviter de retaper l'API
# pour rien : les ressources sans saison et la saison en cours évoluent, une saison
# terminée ne change plus jamais.
football-data.cache.static-ttl-seconds=60
football-data.cache.current-season-ttl-seconds=300
football-data.cache.historical-season-ttl-hours=24
