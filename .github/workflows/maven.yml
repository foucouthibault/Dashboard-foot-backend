# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
    - uses: actions/checkout@v7.0.1
      with:
        # Historique complet pour que SonarQube Cloud puisse attribuer les lignes (blame) et détecter le nouveau code
        fetch-depth: 0
    - name: Set up JDK 25
      uses: actions/setup-java@v6.1.0
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      env:                                                                                                                                                                                                                    
        FOOTBALL_DATA_API_TOKEN: ${{ secrets.FOOTBALL_DATA_API_TOKEN }}  
      run: mvn -B verify --file pom.xml

    # Ignoré quand le secret n'est pas disponible (PR depuis un fork, PR Dependabot)
    - name: Analyze with SonarQube Cloud
      if: env.SONAR_TOKEN != ''
      run: mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar --file pom.xml

    # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@a64327a7329c9939cf675e458452febe1894a70c # v6.0.1

  # Construit l'image Docker sans la publier, pour détecter une casse du Dockerfile.
  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7.0.1
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - name: Build image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        push: false
        load: true
        tags: dashboard-foot-backend:ci
        cache-from: type=gha
        cache-to: type=gha,mode=max
    # Démarre le conteneur sans clé d'API : seul /actuator/health est vérifié (aucun appel amont).
    - name: Smoke test
      run: |
        docker run -d --name backend -p 8080:8080 dashboard-foot-backend:ci
        for i in $(seq 1 60); do
          if curl -fsS http://localhost:8080/actuator/health | grep -q '"UP"'; then
            echo "Le conteneur répond UP"; exit 0
          fi
          sleep 1
        done
        docker logs backend
        exit 1
