name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          # claude-code-action configure sa propre authentification git. Les identifiants
          # gardés par checkout v6+ (fichier chargé via includeIf) ne sont pas effacés par
          # l'action et feraient pousser avec le GITHUB_TOKEN en lecture seule (403).
          persist-credentials: false

      # Permet à Claude de lancer ./mvnw test / verify (le projet demande Java 25)
      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@d535f5172dec02b204866b393d6b20b9b2aaf98d # v1.0.266
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # claude_args: '--allowed-tools Bash(gh pr *)'
          # Maven via le wrapper : runner jetable, sans clé d'API football-data (tests sans réseau)
          # gh : Claude ouvre la PR et lit la CI avec le jeton de l'app Claude (GH_TOKEN fourni
          # par l'action). Pas de GITHUB_TOKEN : une PR ouverte avec lui ne lancerait pas la CI.
          # Sans ces règles, l'action se contente de pousser la branche et de donner un lien.
          claude_args: |
            --allowedTools "Bash(./mvnw:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr checks:*)"
            --append-system-prompt "Si la demande prévoit une PR, ouvre-la toi-même avec gh pr create --base main --body-file pr-body.md (fichier écrit à la racine, jamais commité), puis donne son lien au lieu du lien Create PR."

